spring:
  h2:
    console:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type: true
        use_sql_comments: true


  application:
    name: OrderService

server:
  port: 8083

integration:
  deliveryService:
    url: ${DELIVERY_SERVICE_URL:http://localhost:8081/api/v1}

retryabletask:
  timeoutInSeconds: 36000
  limit: 100